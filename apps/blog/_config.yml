title: Viagem a Portugal
tagline: Mapa interativo e diário de viagem
description: >-
  Mapa interativo de todos os lugares de Viagem a Portugal de José Saramago
  e o diário de quem refaz a viagem pelo país.
# Canonical site origin. Update url (and drop/adjust baseurl) when the
# custom domain goes live. Used by jekyll-seo-tag, jekyll-sitemap and the feed.
url: "https://mrfyda.github.io"
baseurl: "/viagem-a-portugal"
lang: pt-PT
timezone: UTC
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE

# SEO / social (jekyll-seo-tag). No personal byline: the site itself is the
# publisher (an Organization named by `title`, with `logo`). Saramago is the
# book's author/subject, not the blog's. The Twitter card type is set per-page
# (in defaults below) rather than via a top-level `twitter:` key — the latter
# makes seo-tag emit an empty `twitter:site` "@" because there is no handle.
logo: /assets/logo.png
comments: false

# Site-wide defaults: a branded share image (posts may override with `image:`)
# and a large-image Twitter card. jekyll-seo-tag resolves the path against
# url+baseurl.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-default.png
        width: 1200
        height: 630
      twitter:
        card: summary_large_image
  - scope:
      path: ""
      type: en
    values:
      layout: post
      lang: en
  # The Search Console verification file is plumbing, not content — keep it
  # out of the sitemap (Google only needs to fetch it, not index it).
  - scope:
      path: "google139eb38e40a50649.html"
    values:
      sitemap: false

# English translations live in a collection, not _posts: they render pages but
# stay out of the PT home/paginator, the Atom feed, and blog-sync's
# featured-journey scan (which globs _posts only). A `translation_key` in the
# front matter pairs each translation with its PT original — see
# _includes/language_switcher.html and the hreflang block in head.html.
collections:
  en:
    output: true
    permalink: /en/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Build settings
theme: jekyll-whiteglass
markdown: kramdown
excerpt_separator: "<!-- more -->"

# Outputting
permalink: /:year/:month/:day/:title/
paginate_path: /posts/:num/
paginate: 5

# Markdown settings
kramdown:
  auto_ids: false
  enable_coderay: false
  entity_output: as_char
  footnote_nr: 1
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  toc_levels: 1..6
