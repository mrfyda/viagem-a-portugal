name: Build and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress production
# deployments finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/blog

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck map app
        run: pnpm --filter map typecheck

      - name: Test map app
        run: pnpm --filter map test

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Test pipeline data invariants
        run: uv run --with pytest -m pytest tools/book-pipeline/test_data.py -q

      - name: Test blog-sync
        run: uv run --with pytest --with pyyaml -m pytest tools/blog-sync/test_sync.py -q

      - name: Test soundtrack-miner
        run: uv run --with pytest --with pyyaml --with tzdata -m pytest tools/soundtrack-miner/test_mine.py -q

      - name: Sync blog featured journey
        run: uv run tools/blog-sync/sync.py

      - name: Check featured journey is committed
        run: git diff --exit-code apps/map/src/data/featured-journey.json

      - name: Build blog
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: apps/blog
        env:
          JEKYLL_ENV: production

      - name: Build map app
        run: pnpm --filter map export:web
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}/map
          # absent secrets (e.g. fork PRs) produce a read-only build with
          # sign-in hidden — see supabase/README.md
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Assemble site (blog at /, map at /map)
        run: |
          mkdir -p site/map
          cp -R apps/blog/_site/. site/
          cp -R apps/map/dist/. site/map/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
