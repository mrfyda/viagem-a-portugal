# Supabase free tier pauses projects after ~a week without API activity,
# which would silently break Traveler sign-in and sync (docs/adr/0007).
# Two pings a week keep it awake. Skips quietly when secrets are unset.
name: Keep Supabase warm

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret not set — skipping"
            exit 0
          fi
          # Ping the PostgREST root — 200 with just the anon apikey, and it
          # still exercises the DB (schema introspection) so the free-tier
          # project stays awake. The visits table is intentionally anon-revoked
          # (docs/adr/0007), so querying it here would 401.
          curl -sf "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
          echo "pinged"
