# Supabase free tier pauses projects after ~a week without API activity,
# which would silently break Traveler sign-in and sync (docs/adr/0007).
# Two pings a week keep it awake. Skips quietly when secrets are unset.
name: Keep Supabase warm

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret not set — skipping"
            exit 0
          fi
          url="${SUPABASE_URL%/}"  # tolerate a trailing slash in the secret
          # Ping the Auth health endpoint — 200 with the anon/publishable key,
          # enough activity to keep the free-tier project from pausing. We can't
          # query a table here: visits is intentionally anon-revoked
          # (docs/adr/0007) and PostgREST's root requires a secret key.
          curl -sf "$url/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
          echo "pinged"
